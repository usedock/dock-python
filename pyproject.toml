[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usedock"
version = "0.1.0"
description = "Python client for Dock: isolated Linux machines for agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/usedock/dock-python"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6", "types-PyYAML", "jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/usedock"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
