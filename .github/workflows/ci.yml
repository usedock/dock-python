name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Unit tests
        # -rs lists skips; under CI the bash-based tests must run, never skip.
        # The default shell is `bash -e` without pipefail, so set it or tee hides a failing pytest.
        run: |
          set -o pipefail
          pytest tests/test_client.py tests/test_bash_resolver.py -rs | tee unit.log
          if grep -E '^SKIPPED' unit.log; then echo "tests were skipped in CI"; exit 1; fi
      - name: Read pinned scenarios ref
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < SCENARIOS_REF)" >> "$GITHUB_OUTPUT"
      - name: Check out shared scenarios
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: usedock/dock
          ref: ${{ steps.ref.outputs.sha }}
          path: dock
          sparse-checkout: sdk-scenarios
      - name: Scenario tests (offline)
        env:
          DOCK_SCENARIOS_DIR: ${{ github.workspace }}/dock/sdk-scenarios
          DOCK_SCENARIOS_REQUIRED: "1"
        run: pytest tests/test_scenarios.py -rs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
